<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161a1f">
  <title>Domingo na Paulista</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="lobby">
    <form id="lobbyForm" class="card" autocomplete="off">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="10" width="40" height="5" fill="#e04a3a"/>
          <rect x="6" y="10" width="5" height="32" fill="#e04a3a"/>
          <rect x="37" y="10" width="5" height="32" fill="#e04a3a"/>
          <rect x="11" y="17" width="26" height="11" fill="#f7f3ea"/>
          <rect x="2" y="42" width="44" height="3" fill="#e9cf74"/>
        </svg>
        <div>
          <h1>DOMINGO NA PAULISTA</h1>
          <p class="tag">A avenida é sua e dos seus amigos</p>
        </div>
      </div>

      <div class="row" id="joinRows">
        <label>Seu nome<input id="name" maxlength="20" placeholder="Manifestante"></label>
        <label>Código da sala<input id="room" maxlength="16"></label>
      </div>

      <div class="field"><span>Seu lado</span><div id="sides" class="swatches"></div></div>
      <div class="field"><span>Pele</span><div id="skins" class="swatches"></div></div>
      <div class="field"><span>Na cabeça</span><div id="hats" class="chips"></div></div>
      <div class="field"><span>Na mão</span><div id="items" class="chips"></div></div>
      <label id="signRow">Texto do cartaz<input id="sign" maxlength="40" placeholder="Escreva sua mensagem"></label>

      <div class="actions">
        <button type="button" id="cancel" class="ghost" hidden>Voltar</button>
        <button type="submit" id="play">Ir para a avenida</button>
      </div>
      <p class="hint">Mande o código da sala para os amigos: quem usar o mesmo código entra na mesma avenida.</p>
    </form>
  </div>

  <div id="hud" hidden>
    <div class="top">
      <div class="pill"><span class="dim">Sala</span> <b id="roomCode"></b> · <span id="count">1</span> na avenida</div>
      <button id="invite" class="pill btn">Copiar convite</button>
      <button id="edit" class="pill btn">Visual</button>
    </div>
    <div id="labels"></div>
    <div id="log"></div>
    <form id="chat"><input id="chatInput" maxlength="120" placeholder="Enter para conversar"></form>
    <div id="stick" hidden><div id="knob"></div></div>
    <button id="jump" hidden aria-label="Pular">⤒</button>
    <div class="help">WASD / setas: andar · Shift: correr · Espaço: pular · Q/E ou arrastar: girar câmera</div>
    <div id="toast" hidden></div>
  </div>

  <script type="module" src="/game.js"></script>
</body>
</html>
